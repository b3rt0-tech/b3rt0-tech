<svg xmlns="http://www.w3.org/2000/svg" width="188" height="48" viewBox="0 0 188 48" role="img" aria-labelledby="title desc" fill="none"><title id="title">LinkedIn</title><desc id="desc">https://www.linkedin.com/in/felipefranceschini</desc><style>@font-face{font-family:'B3 Geist';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
.s4,.s5,.s6{font-family:'B3 Geist','Geist',Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .m4,.m5{font-family:'B3 Geist Mono','Geist Mono','JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.s4,.m4{font-weight:400} .s5,.m5{font-weight:500} .s6{font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes ring{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sweep{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sweepl{0%{transform:scaleX(0);opacity:1}35%,80%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
@keyframes nudge{0%,70%,100%{transform:translate(0,0)}80%{transform:translate(3px,-3px)}}
.rise{animation:rise .7s cubic-bezier(.2,0,0,1) both} .fade{animation:fade .8s cubic-bezier(.2,0,0,1) both}
.pulse{animation:pulse 2s ease-in-out infinite} .blink{animation:blink 1.06s steps(1) infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 2s cubic-bezier(.2,0,0,1) infinite}
.sweep{transform-box:fill-box;transform-origin:left center;animation:sweep 1.4s cubic-bezier(.2,0,0,1) both}
.sweepl{transform-box:fill-box;transform-origin:left center;animation:sweepl 4.5s cubic-bezier(.2,0,0,1) infinite}
.nudge{animation:nudge 3.2s cubic-bezier(.2,0,0,1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
